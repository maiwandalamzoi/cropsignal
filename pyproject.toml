[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropsignal"
version = "0.1.0"
description = "Multi-sensor Earth observation toolkit for agricultural monitoring: verified cropland sampling, multi-index time series, drought indices and phenology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maiwand Jan Alamzoi", email = "m.alamzoi123@gmail.com" }]
keywords = [
    "earth-observation", "remote-sensing", "agriculture", "sentinel-2",
    "sentinel-1", "google-earth-engine", "drought", "phenology",
    "crop-monitoring", "food-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "earthengine-api>=0.1.390",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
analysis = ["scikit-learn>=1.3", "scipy>=1.11", "matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/maiwandalamzoi/cropsignal"
Issues = "https://github.com/maiwandalamzoi/cropsignal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
