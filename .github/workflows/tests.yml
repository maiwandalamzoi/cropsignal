name: tests

# Runs on every push and PR. Deliberately does NOT call Earth Engine: the
# test suite is built to need no credentials and no network access - it
# exercises the phenology math, the drought formulas, and the nine
# regressions in tests/test_regressions.py against synthetic and already-
# extracted data. A contributor can fork this repo and get a green check
# with no GEE service account of their own.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[analysis,dev]"

      - name: Test
        run: pytest -q

      - name: Syntax-check every analysis script
        run: |
          for f in analysis/*.py; do
            python -c "import ast; ast.parse(open('$f', encoding='utf-8').read())"
          done
